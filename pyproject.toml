[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-hosting-digest-plugin"
version = "0.1.0"
description = "Hermes slash command plugin for hosting cost digests."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Tyler Cooper" },
  { name = "Hermes Agent" }
]

[tool.pytest.ini_options]
testpaths = ["tests"]
